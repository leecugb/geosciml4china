<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 斜长花岗岩花纹（γο，自定义，非 DZ/T 0179 表15 条目）：最小可重复单元 100×100
       原程序化花纹 n_up_tack 转录（2026-09-19 用户定转 SVG）：N 字形与 丄 棋盘交替；
       母元臂长 10（N：左竖 + 顶左→底右对角 + 右竖；丄：横 20、上竖 10）；
       棋盘中心 (25,25)/(75,75)=N、(75,25)/(25,75)=丄；线宽 2 参照 ηγJ1；
       底色 R242 G85 B133（γοC2 表6 晚石炭世配色）；花纹色白色；
       瓦片四边均落在空隙，平铺时边界无裁切 -->
  <rect width="100" height="100" fill="rgb(242,85,133)"/>
  <g stroke="white" stroke-width="2" fill="none">
    <!-- (25,25) N：左竖、对角（图上为顶左→底右 "\"）、右竖 -->
    <line x1="15" y1="15" x2="15" y2="35"/>
    <line x1="15" y1="15" x2="35" y2="35"/>
    <line x1="35" y1="15" x2="35" y2="35"/>
    <!-- (75,25) 丄 -->
    <line x1="65" y1="25" x2="85" y2="25"/>
    <line x1="75" y1="15" x2="75" y2="25"/>
    <!-- (25,75) 丄 -->
    <line x1="15" y1="75" x2="35" y2="75"/>
    <line x1="25" y1="65" x2="25" y2="75"/>
    <!-- (75,75) N -->
    <line x1="65" y1="65" x2="65" y2="85"/>
    <line x1="65" y1="65" x2="85" y2="85"/>
    <line x1="85" y1="65" x2="85" y2="85"/>
  </g>
</svg>
