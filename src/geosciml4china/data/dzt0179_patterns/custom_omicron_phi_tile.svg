<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <!-- 角闪石岩花纹（οφ，自定义，非 DZ/T 0179 表15 条目）：最小可重复单元 50×50
       原程序化花纹 dashdash_lt 转录（2026-09-19 用户定转 SVG）：「双短横+左尖角」均布
       （短横 (15→21.5)、(24.5→31)，尖角顶点 (30.5,25) 张臂至 (35,20.5)/(35,29.5)）；
       母元中心 (25,25)，列距 50、行距 50；线宽 2 参照 ηγJ1；
       底色 R153 G102 B255（οφD1 表11 超基性晚古生代配色）；花纹色白色；
       瓦片四边均落在空隙，平铺时边界无裁切 -->
  <rect width="50" height="50" fill="rgb(153,102,255)"/>
  <g stroke="white" stroke-width="2" fill="none">
    <!-- 双短横 -->
    <line x1="15" y1="25" x2="21.5" y2="25"/>
    <line x1="24.5" y1="25" x2="31" y2="25"/>
    <!-- 左尖角 < -->
    <line x1="35" y1="20.5" x2="30.5" y2="25"/>
    <line x1="30.5" y1="25" x2="35" y2="29.5"/>
  </g>
</svg>
