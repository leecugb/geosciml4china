<svg xmlns="http://www.w3.org/2000/svg" width="65" height="82" viewBox="0 0 65 82">
  <!-- DZ/T 0179 表15 侵入岩填充花纹：σS 志留纪橄榄岩（最小可重复单元 65×82，修改版）
       底色 R153 G77 B255；花纹色白色；列距 65；行距 41；
       A 行 倒V 中心 (52.5, 20.5)、B 行 倒V 中心 (20, 61.5)（B 相对 A 左移 32.5 = 50% 列距）；
       母元 倒V（^）：dx=11、dy=10（夹角约 95°，较原版加大）；线宽 2（参照 ηγJ1）；
       瓦片四边均落在空隙，平铺时边界无裁切；2026-09-18 用户指定修改 -->
  <rect width="65" height="82" fill="rgb(153,77,255)"/>
  <g stroke="white" stroke-width="2" fill="none">
    <!-- A 行完整 倒V，中心 (52.5, 20.5)：宽角人字 dx=11、dy=10 -->
    <polyline points="41.5,30.5 52.5,10.5 63.5,30.5"/>
    <!-- B 行完整 倒V，中心 (20, 61.5)，错开 50% 列距 -->
    <polyline points="9,71.5 20,51.5 31,71.5"/>
  </g>
</svg>
