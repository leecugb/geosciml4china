<svg xmlns="http://www.w3.org/2000/svg" width="50" height="64" viewBox="0 0 50 64">
  <!-- DZ/T 0179 表16 新生代以前火山岩花纹：流纹岩（最小可重复单元 50×64）
       底色 R247 G210 B49（P2 统色，表16 示例 流纹岩 P2k）；花纹色 K50 灰 R128 G128 B128（表16 规则）；
       参照 custom.gamma 花岗岩模式：十字中心保留小正方形缺口、整体旋转 45°——
       四斜臂起于缺口四角（内径 r=4）向外（外径 r=12），中央呈中空菱形；
       列距 50、行距 32；A 行母元中心 (37, 18)、B 行母元中心 (12, 50)（B 相对 A 左移 25 = 50% 列距）；
       瓦片四边均落在空隙，平铺时边界无裁切；2026-09-18 用户指定模式生成 -->
  <rect width="50" height="64" fill="rgb(247,210,49)"/>
  <g stroke="rgb(128,128,128)" stroke-width="2" fill="none">
    <!-- A 行完整母元，中心 (37, 18)：四斜臂（缺口对角线 r=4 → 臂端 r=12） -->
    <line x1="34.2" y1="15.2" x2="28.5" y2="9.5"/>
    <line x1="39.8" y1="15.2" x2="45.5" y2="9.5"/>
    <line x1="34.2" y1="20.8" x2="28.5" y2="26.5"/>
    <line x1="39.8" y1="20.8" x2="45.5" y2="26.5"/>
    <!-- B 行完整母元，中心 (12, 50)，错开 50% 列距 -->
    <line x1="9.2" y1="47.2" x2="3.5" y2="41.5"/>
    <line x1="14.8" y1="47.2" x2="20.5" y2="41.5"/>
    <line x1="9.2" y1="52.8" x2="3.5" y2="58.5"/>
    <line x1="14.8" y1="52.8" x2="20.5" y2="58.5"/>
  </g>
</svg>
