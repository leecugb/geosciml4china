<svg xmlns="http://www.w3.org/2000/svg" width="16.88" height="16.88" viewBox="0 0 16.88 16.88">
  <!-- DZ/T 0179 表5 第四系成因花纹：洪积 pl（最小可重复单元 16.88×16.88，累计 ×0.56 缩小版）
       底色透明（叠加于第四系年代色之上）；花纹色 C60 = R102 G255 B255（表5 洪积花纹色）；
       冲积 al 母元（中心 (6.75, 8.44)）：右上椭圆（长轴 45°）、左下椭圆（长轴 135°），rx=2.25、ry=1.12；
       水平加密一倍多添加出来的基本单元（中心 (15.19, 8.44)）：每个椭圆形用圆点替代——
       右上点 (19.12, 4.5)（按平铺环绕绘于本瓦片 (2.25, 4.5)）、左下点 (11.25, 12.38)，r=0.83 实心；
       平铺后两亚层各自形成 椭圆—点—椭圆—点 的 8.44 周期交替；
       列距 16.88、行距 16.88；线宽 0.83；瓦片四边均落在空隙，平铺时边界无裁切；
       2026-09-19 定稿几何 ×0.75 再 ×0.75 等比缩小（元素+间距+线宽同率，用户定） -->
  <g stroke="rgb(102,255,255)" stroke-width="0.83" fill="none">
    <!-- 原母元：双椭圆 -->
    <ellipse cx="10.69" cy="4.5" rx="2.25" ry="1.12" transform="rotate(45 10.69 4.5)"/>
    <ellipse cx="2.81" cy="12.38" rx="2.25" ry="1.12" transform="rotate(135 2.81 12.38)"/>
    <!-- 添加母元：双圆点（(25.5,6) 环绕至 (3,6)） -->
    <circle cx="2.25" cy="4.5" r="0.83" fill="rgb(102,255,255)" stroke="none"/>
    <circle cx="11.25" cy="12.38" r="0.83" fill="rgb(102,255,255)" stroke="none"/>
  </g>
</svg>
