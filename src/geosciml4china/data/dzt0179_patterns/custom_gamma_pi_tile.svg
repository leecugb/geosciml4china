<svg xmlns="http://www.w3.org/2000/svg" width="50" height="64" viewBox="0 0 50 64">
  <!-- 花岗斑岩花纹（自定义，非 DZ/T 0179 表15 条目）：最小可重复单元 50×64
       底色 R255 G102 B26（γπ 族色，库尔干/英吉沙 γπT3 同）；花纹色白色；
       参照 custom.gamma 花岗岩模式：+ 的横线加粗（横粗 5、竖细 2）；列距 50、行距 32；
       A 行 + 中心 (37, 18)、B 行 + 中心 (12, 50)（B 相对 A 左移 25 = 50% 列距）；
       瓦片四边均落在空隙，平铺时边界无裁切；同构于库尔干 cross_bold_h 花纹；
       2026-09-18 用户指定模式生成 -->
  <rect width="50" height="64" fill="rgb(255,102,26)"/>
  <g stroke="white" fill="none">
    <!-- A 行完整 +，中心 (37, 18)：竖 20（细 2）、横 20（粗 5） -->
    <line x1="37" y1="8" x2="37" y2="28" stroke-width="2"/>
    <line x1="27" y1="18" x2="47" y2="18" stroke-width="5"/>
    <!-- B 行完整 +，中心 (12, 50)，错开 50% 列距 -->
    <line x1="12" y1="40" x2="12" y2="60" stroke-width="2"/>
    <line x1="2" y1="50" x2="22" y2="50" stroke-width="5"/>
  </g>
</svg>
