<svg xmlns="http://www.w3.org/2000/svg" width="50" height="64" viewBox="0 0 50 64">
  <!-- DZ/T 0179 表15 侵入岩填充花纹：χO1 早奥陶世煌斑岩（最小可重复单元 50×64，加密加大版）
       底色 R179 G64 B255；花纹色红 R255 G0 B0（煌斑岩花纹为红色或黑色，表15 规则）；
       参照 νD3 辉长岩模式：X → L（双臂等长 18、竖细 2、横粗 5）；
       列距 50、行距 32（较 65×41 加密）；A 行 L 角点 (30, 18)、B 行 L 角点 (5, 50)（B 相对 A 左移 25 = 50% 列距）；
       瓦片四边均落在空隙，平铺时边界无裁切；2026-09-18 用户指定模式生成 -->
  <rect width="50" height="64" fill="rgb(179,64,255)"/>
  <g stroke="rgb(255,0,0)" fill="none">
    <!-- A 行完整 L，角点 (30, 18)：竖臂 18（细 2）、横臂 18（粗 5） -->
    <line x1="30" y1="3" x2="30" y2="18" stroke-width="2"/>
    <line x1="30" y1="18" x2="48" y2="18" stroke-width="5"/>
    <!-- B 行完整 L，角点 (5, 50)，错开 50% 列距 -->
    <line x1="5" y1="35" x2="5" y2="50" stroke-width="2"/>
    <line x1="5" y1="50" x2="23" y2="50" stroke-width="5"/>
  </g>
</svg>
