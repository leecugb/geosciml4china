<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 正长花岗岩花纹（ξγ，自定义）：最小可重复单元 100×100
       底色 R255 G77 B77（ξγ 族现配色，英吉沙 ξγE/ξγP1）；花纹色白色（酸性岩花纹为白色或黑色，表15 规则）；
       参照 ηγJ1 二长花岗岩模式：棋盘交替、母元间距 50、周期 2×2 母元格；= 替换为 K（Arial 字体 28pt）；
       内容 4 个完整母元——+ (25,25)、K (75,25)、K (25,75)、+ (75,75)；
       瓦片四边均落在空隙，平铺时边界无裁切；2026-09-18 用户指定模式生成 -->
  <rect width="100" height="100" fill="rgb(255,77,77)"/>
  <g stroke="white" stroke-width="2" fill="none">
    <!-- + ，中心 (25,25)：正交十字，臂长 15 -->
    <line x1="10" y1="25" x2="40" y2="25"/>
    <line x1="25" y1="10" x2="25" y2="40"/>
    <!-- K ，中心 (75,25)：Arial 字体 28pt -->
    <text x="75" y="35" font-family="Arial" font-size="28" font-weight="normal"
          fill="white" stroke="none" text-anchor="middle">K</text>
    <!-- K ，中心 (25,75)：Arial 字体 28pt -->
    <text x="25" y="85" font-family="Arial" font-size="28" font-weight="normal"
          fill="white" stroke="none" text-anchor="middle">K</text>
    <!-- + ，中心 (75,75) -->
    <line x1="60" y1="75" x2="90" y2="75"/>
    <line x1="75" y1="60" x2="75" y2="90"/>
  </g>
</svg>
