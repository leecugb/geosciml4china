<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- DZ/T 0179 表15 侵入岩填充花纹：γδT2 中三叠世花岗闪长岩
       底色 R255 G77 B255；花纹白色；2026-09-18 用户给定人工转录版 -->
  <rect width="200" height="200" fill="rgb(255,77,255)"/>

  <g stroke="white" stroke-width="2" fill="none">
    <!-- ================= 第一行：+  丄  +  丄 ================= -->
    <!-- (25,25) + -->
    <line x1="10" y1="25" x2="40" y2="25"/>
    <line x1="25" y1="10" x2="25" y2="40"/>

    <!-- (75,25) 丄 -->
    <line x1="60" y1="25" x2="90" y2="25"/>
    <line x1="75" y1="10" x2="75" y2="25"/>

    <!-- (125,25) + -->
    <line x1="110" y1="25" x2="140" y2="25"/>
    <line x1="125" y1="10" x2="125" y2="40"/>

    <!-- (175,25) 丄 -->
    <line x1="160" y1="25" x2="190" y2="25"/>
    <line x1="175" y1="10" x2="175" y2="25"/>

    <!-- ================= 第二行：丄  +  丄  + ================= -->
    <!-- (25,75) 丄 -->
    <line x1="10" y1="75" x2="40" y2="75"/>
    <line x1="25" y1="60" x2="25" y2="75"/>

    <!-- (75,75) + -->
    <line x1="60" y1="75" x2="90" y2="75"/>
    <line x1="75" y1="60" x2="75" y2="90"/>

    <!-- (125,75) 丄 -->
    <line x1="110" y1="75" x2="140" y2="75"/>
    <line x1="125" y1="60" x2="125" y2="75"/>

    <!-- (175,75) + -->
    <line x1="160" y1="75" x2="190" y2="75"/>
    <line x1="175" y1="60" x2="175" y2="90"/>

    <!-- ================= 第三行：+  丄  +  丄 ================= -->
    <!-- (25,125) + -->
    <line x1="10" y1="125" x2="40" y2="125"/>
    <line x1="25" y1="110" x2="25" y2="140"/>

    <!-- (75,125) 丄 -->
    <line x1="60" y1="125" x2="90" y2="125"/>
    <line x1="75" y1="110" x2="75" y2="125"/>

    <!-- (125,125) + -->
    <line x1="110" y1="125" x2="140" y2="125"/>
    <line x1="125" y1="110" x2="125" y2="140"/>

    <!-- (175,125) 丄 -->
    <line x1="160" y1="125" x2="190" y2="125"/>
    <line x1="175" y1="110" x2="175" y2="125"/>

    <!-- ================= 第四行：丄  +  丄  + ================= -->
    <!-- (25,175) 丄 -->
    <line x1="10" y1="175" x2="40" y2="175"/>
    <line x1="25" y1="160" x2="25" y2="175"/>

    <!-- (75,175) + -->
    <line x1="60" y1="175" x2="90" y2="175"/>
    <line x1="75" y1="160" x2="75" y2="190"/>

    <!-- (125,175) 丄 -->
    <line x1="110" y1="175" x2="140" y2="175"/>
    <line x1="125" y1="160" x2="125" y2="175"/>

    <!-- (175,175) + -->
    <line x1="160" y1="175" x2="190" y2="175"/>
    <line x1="175" y1="160" x2="175" y2="190"/>
  </g>
</svg>
