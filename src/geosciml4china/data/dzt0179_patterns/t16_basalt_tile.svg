<svg xmlns="http://www.w3.org/2000/svg" width="32" height="44" viewBox="0 0 32 44">
  <!-- DZ/T 0179 表16 新生代以前火山岩花纹：玄武岩（最小可重复单元 32×44，继续加密版）
       底色 R140 G255 B51（K1 统色，表16 示例 玄武岩 K1y）；花纹色 K50 灰 R128 G128 B128（表16 规则）；
       参照 δK2 闪长岩模式：母元 倒L（横臂 dx=10、竖臂 dy=10）；列距 32、行距 22（继续加密；
       行距 22 为保持竖臂 10 的几何下限）；A 行 倒L 角点 (20, 10)、B 行 倒L 角点 (4, 32)
       （B 相对 A 左移 16 = 50% 列距）；瓦片四边均落在空隙，平铺时边界无裁切；
       2026-09-18 用户指定继续加密 -->
  <rect width="32" height="44" fill="rgb(140,255,51)"/>
  <g stroke="rgb(128,128,128)" stroke-width="2" fill="none">
    <!-- A 行完整 倒L，角点 (20, 10)：横 10、竖 10 -->
    <line x1="20" y1="10" x2="30" y2="10"/>
    <line x1="20" y1="10" x2="20" y2="20"/>
    <!-- B 行完整 倒L，角点 (4, 32)，错开 50% 列距 -->
    <line x1="4" y1="32" x2="14" y2="32"/>
    <line x1="4" y1="32" x2="4" y2="42"/>
  </g>
</svg>
