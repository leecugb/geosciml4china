<svg xmlns="http://www.w3.org/2000/svg" width="50" height="64" viewBox="0 0 50 64">
  <!-- 花岗岩花纹（自定义，非 DZ/T 0179 表15 条目）：最小可重复单元 50×64
       底色 R255 G0 B102（英吉沙 γ 花岗岩脉现配色）；花纹色白色；
       参照 δK2 闪长岩模式：母元 丄 → +（臂 dx=10、dy=10）；列距 50、行距 32；
       A 行 + 中心 (37, 18)、B 行 + 中心 (12, 50)（B 相对 A 左移 25 = 50% 列距）；
       瓦片四边均落在空隙，平铺时边界无裁切；2026-09-18 用户指定模式生成 -->
  <rect width="50" height="64" fill="rgb(255,0,102)"/>
  <g stroke="white" stroke-width="2" fill="none">
    <!-- A 行完整 +，中心 (37, 18)：正交十字，横 20、竖 20 -->
    <line x1="27" y1="18" x2="47" y2="18"/>
    <line x1="37" y1="8" x2="37" y2="28"/>
    <!-- B 行完整 +，中心 (12, 50)，错开 50% 列距 -->
    <line x1="2" y1="50" x2="22" y2="50"/>
    <line x1="12" y1="40" x2="12" y2="60"/>
  </g>
</svg>
