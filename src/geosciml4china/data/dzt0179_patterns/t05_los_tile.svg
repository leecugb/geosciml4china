       底色透明（叠加于第四系年代色之上）；花纹色 M25 Y36 K15 = R217 G163 B139（表5 黄土花纹色）；
       基本单元 = 7 条等间距竖线（x = 3+6k，线距 d=6，线长 20、线宽 1.5）；
       基本单元竖直间距为 0（行距 = 线长 20，各段首尾相接成连续竖列）；
       基本单元水平间距为竖线间距的 2 倍（跨缝线距 = 12 = 2d，组间可辨）；
       瓦片四边均落在空隙，平铺时边界无裁切；2026-09-19 用户指定模式生成 -->
