    <line x1="15" y1="0" x2="15" y2="20"/>
    <line x1="21" y1="0" x2="21" y2="20"/>
    <line x1="27" y1="0" x2="27" y2="20"/>
    <line x1="33" y1="0" x2="33" y2="20"/>
    <line x1="39" y1="0" x2="39" y2="20"/>
