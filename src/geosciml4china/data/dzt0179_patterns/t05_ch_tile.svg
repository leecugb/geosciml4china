<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- DZ/T 0179 表5 第四系成因花纹：化学堆积 ch（最小可重复单元 18×18，间距缩减版）
       底色透明（叠加于第四系年代色之上）；花纹色 M25 Y36 K15 = R217 G163 B139（表5 化学堆积花纹色）；
       参照 δK2 闪长岩模式：基本元素为平行竖线（双竖线），第二条竖线稍微向下移动（下移 2.25）——
       A 母元中心 (13.5, 4)：线1 x=12.6（y 0.62–7.38）、线2 x=14.4（y 2.87–9.63）；
       B 母元中心 (4.5, 12)：线1 x=3.6（y 8.62–15.38）、线2 x=5.4（y 10.87–17.63）；
       B 相对 A 左移 9 = 50% 列距；线长 6.75（不变）、平行竖线间距 2.5→1.8、
       基本单元间距 22.5→18、线宽 0.83；
       瓦片四边均落在空隙，平铺时边界无裁切；2026-09-20 用户指定间距缩减 -->
  <g stroke="rgb(217,163,139)" stroke-width="0.83" fill="none">
    <!-- A 母元：双竖线，第二条下移 2.25 -->
    <line x1="12.6" y1="0.62" x2="12.6" y2="7.38"/>
    <line x1="14.4" y1="2.87" x2="14.4" y2="9.63"/>
    <!-- B 母元：双竖线，第二条下移 2.25，交错 50% 列距 -->
    <line x1="3.6" y1="8.62" x2="3.6" y2="15.38"/>
    <line x1="5.4" y1="10.87" x2="5.4" y2="17.63"/>
  </g>
</svg>
