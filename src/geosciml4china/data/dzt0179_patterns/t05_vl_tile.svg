<svg xmlns="http://www.w3.org/2000/svg" width="45" height="45" viewBox="0 0 45 45">
  <!-- DZ/T 0179 表5 第四系成因花纹：火山堆积 vl（最小可重复单元 45×45，×0.6 缩减版）
       底色透明（叠加于第四系年代色之上）；花纹色 C0 M100 Y100 K0 = R255 G0 B0（表5 火山堆积花纹色）；
       参照二长花岗岩（ηγJ1）模式：+ 旋转 45° 为 ×（半臂 6.75、对角偏移 ±4.77），
       双斜线 = 替换为正三角形 △（外接半径 6.75：顶点上、底角 ±5.85/+3.38）；
       棋盘中心 (11.25,11.25)/(33.75,33.75)=×、(33.75,11.25)/(11.25,33.75)=△；
       元素尺寸与间距较母版缩减 40%（75→45）；线宽 0.9；
       瓦片四边均落在空隙，平铺时边界无裁切；2026-09-20 用户指定缩减 -->
  <g stroke="rgb(255,0,0)" stroke-width="0.9" fill="none">
    <!-- (11.25,11.25) ×（+ 旋转 45°） -->
    <line x1="6.48" y1="6.48" x2="16.02" y2="16.02"/>
    <line x1="16.02" y1="6.48" x2="6.48" y2="16.02"/>
    <!-- (33.75,11.25) 正三角形 △ -->
    <polyline points="33.75,4.5 39.6,14.63 27.9,14.63 33.75,4.5"/>
    <!-- (11.25,33.75) 正三角形 △ -->
    <polyline points="11.25,27 17.1,39.38 5.4,39.38 11.25,27"/>
    <!-- (33.75,33.75) × -->
    <line x1="28.98" y1="28.98" x2="38.52" y2="38.52"/>
    <line x1="38.52" y1="28.98" x2="28.98" y2="38.52"/>
  </g>
</svg>
