<svg xmlns="http://www.w3.org/2000/svg" width="22.2" height="22.2" viewBox="0 0 22.2 22.2">
  <!-- DZ/T 0179 表5 第四系成因花纹：冲洪积 alp（最小可重复单元 22.2×22.2，累计 ×0.56 缩小版）
       2026-09-18 用户给定 SVG 定稿；2026-09-19 定稿几何 ×0.75 再 ×0.75 等比缩小（元素+间距+线宽同率，用户定）：
       元素间距 11.1、行距 5.55——
       行1 y=2.78：点 x=2.4/13.58；行2 y=8.32：点 x=8.02、环 x=19.12（长轴 45°）；
       行3 y=13.88：点 x=2.4/13.58；行4 y=19.5：环 x=8.02（长轴 135°）、点 x=19.12；
       元素：点 r=1.01、环 rx=2.55 ry=1.24 线宽 0.68；色 #5cf2f2；
       背景 #f4f6f8（可选——叠加于第四系年代色使用时去除背景矩形即为透明底） -->

  <!-- 背景 (可选，这里设为浅灰白色以匹配原图观感) -->
  <rect width="100%" height="100%" fill="#f4f6f8" />

  <!-- 定义花纹颜色 -->
  <g fill="#5cf2f2" stroke="#5cf2f2">

    <!-- 1. 实心圆点 (Circles) -->
    <!-- 行1 -->
    <circle cx="2.4" cy="2.78" r="1.01" stroke="none" />
    <circle cx="13.58" cy="2.78" r="1.01" stroke="none" />
    <!-- 行2 -->
    <circle cx="8.02" cy="8.32" r="1.01" stroke="none" />
    <!-- 行3 -->
    <circle cx="2.4" cy="13.88" r="1.01" stroke="none" />
    <circle cx="13.58" cy="13.88" r="1.01" stroke="none" />
    <!-- 行4 -->
    <circle cx="19.12" cy="19.5" r="1.01" stroke="none" />

    <!-- 2. 空心椭圆环 (Ellipses) -->
    <!-- 行2 右侧倾斜椭圆 -->
    <ellipse cx="19.12" cy="8.32" rx="2.55" ry="1.24" fill="none" stroke-width="0.68" transform="rotate(45 19.12 8.32)" />

    <!-- 行4 左侧倾斜椭圆 -->
    <ellipse cx="8.02" cy="19.5" rx="2.55" ry="1.24" fill="none" stroke-width="0.68" transform="rotate(135 8.02 19.5)" />

  </g>
</svg>
