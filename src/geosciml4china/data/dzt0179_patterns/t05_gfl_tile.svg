<svg xmlns="http://www.w3.org/2000/svg" width="33.75" height="22.5" viewBox="0 0 33.75 22.5">
  <!-- DZ/T 0179 表5 第四系成因花纹：冰水堆积 gfl（最小可重复单元 33.75×22.5，累计 ×0.56 缩小版）
       底色透明（叠加于第四系年代色之上）；花纹色 C60 = R102 G255 B255（表5 冰水堆积花纹色）；
       棋盘交替：第一行 = 圆点、135° 椭圆、圆点、45° 椭圆；
       第二行 = 45° 椭圆、竖线、135° 椭圆、竖线（与冰碛 g 第二行一致）；
       元素间距 8.44、行距 11.25；圆点 r=1.12 实心、竖线长 6.75、椭圆 rx=2.25 ry=1.12、线宽 0.83；
       瓦片四边均落在空隙，平铺时边界无裁切；
       2026-09-19 定稿几何 ×0.75 再 ×0.75 等比缩小（元素+间距+线宽同率，用户定） -->
  <g stroke="rgb(102,255,255)" stroke-width="0.83" fill="none">
    <!-- 第一行（y=7.5）：圆点、135° 椭圆、圆点、45° 椭圆 -->
    <circle cx="4.22" cy="5.62" r="1.12" fill="rgb(102,255,255)" stroke="none"/>
    <ellipse cx="12.66" cy="5.62" rx="2.25" ry="1.12" transform="rotate(135 12.66 5.62)"/>
    <circle cx="21.09" cy="5.62" r="1.12" fill="rgb(102,255,255)" stroke="none"/>
    <ellipse cx="29.53" cy="5.62" rx="2.25" ry="1.12" transform="rotate(45 29.53 5.62)"/>
    <!-- 第二行（y=22.5）：45° 椭圆、竖线、135° 椭圆、竖线 -->
    <ellipse cx="4.22" cy="16.88" rx="2.25" ry="1.12" transform="rotate(45 4.22 16.88)"/>
    <line x1="12.66" y1="13.5" x2="12.66" y2="20.25"/>
    <ellipse cx="21.09" cy="16.88" rx="2.25" ry="1.12" transform="rotate(135 21.09 16.88)"/>
    <line x1="29.53" y1="13.5" x2="29.53" y2="20.25"/>
  </g>
</svg>
