<svg xmlns="http://www.w3.org/2000/svg" width="32" height="44" viewBox="0 0 32 44">
  <!-- DZ/T 0179 表17 新生代火山岩花纹：玄武岩（最小可重复单元 32×44）
       底色 R255 G242 B166（N2f 示例底色，表17）；花纹色 C100 Y100 K30 = R0 G179 B0
       （表17 新生代火山岩花纹色，与新生代以前 K50 灰不同，5.4.1）；
       母元与排布同 t16_volcanic.basalt：倒L（横臂 dx=10、竖臂 dy=10）、
       列距 32、行距 22；A 行 倒L 角点 (20, 10)、B 行 倒L 角点 (4, 32)（B 相对 A 左移 16 = 50% 列距）；
       瓦片四边均落在空隙，平铺时边界无裁切；2026-09-18 依用户指令按玄武岩花纹生成 -->
  <rect width="32" height="44" fill="rgb(255,242,166)"/>
  <g stroke="rgb(0,179,0)" stroke-width="2" fill="none">
    <!-- A 行完整 倒L，角点 (20, 10)：横 10、竖 10 -->
    <line x1="20" y1="10" x2="30" y2="10"/>
    <line x1="20" y1="10" x2="20" y2="20"/>
    <!-- B 行完整 倒L，角点 (4, 32)，错开 50% 列距 -->
    <line x1="4" y1="32" x2="14" y2="32"/>
    <line x1="4" y1="32" x2="4" y2="42"/>
  </g>
</svg>
