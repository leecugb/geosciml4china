<svg xmlns="http://www.w3.org/2000/svg" width="50" height="64" viewBox="0 0 50 64">
  <!-- DZ/T 0179 表16 新生代以前火山岩花纹：粗安岩（最小可重复单元 50×64）
       底色 R153 G255 B255（J2-3 统色，表16 示例 粗安岩 J2-3t）；花纹色 K50 灰 R128 G128 B128（表16 规则）；
       参照 δK2 闪长岩模式：母元 丅 + 1 条平行横线（平行线在主横线上方、间距 4；
       竖线仅与主横线（下横）相交、下垂 8（继续缩短版，横:竖=2.5:1））；
       列距 50、行距 32；A 行母元中心 (37, 18)、B 行母元中心 (12, 50)（B 相对 A 左移 25 = 50% 列距）；
       瓦片四边均落在空隙，平铺时边界无裁切；2026-09-18 用户指定模式生成 -->
  <rect width="50" height="64" fill="rgb(153,255,255)"/>
  <g stroke="rgb(128,128,128)" stroke-width="2" fill="none">
    <!-- A 行完整母元，中心 (37, 18)：平行线在上 (27-47, y=12)、主横线 (y=16)、
         竖线仅与主横线相交 (37, 16→24) -->
    <line x1="27" y1="12" x2="47" y2="12"/>
    <line x1="27" y1="16" x2="47" y2="16"/>
    <line x1="37" y1="16" x2="37" y2="24"/>
    <!-- B 行完整母元，中心 (12, 50)，错开 50% 列距 -->
    <line x1="2" y1="44" x2="22" y2="44"/>
    <line x1="2" y1="48" x2="22" y2="48"/>
    <line x1="12" y1="48" x2="12" y2="56"/>
  </g>
</svg>
