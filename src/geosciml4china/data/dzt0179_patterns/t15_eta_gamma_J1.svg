<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- DZ/T 0179 表15 侵入岩填充花纹：ηγJ1 早侏罗世二长花岗岩
       底色 R255 G51 B102；花纹白色；2026-09-18 用户给定人工转录版 -->
  <rect width="200" height="200" fill="rgb(255,51,102)"/>

  <g stroke="white" stroke-width="2" fill="none">
    <!-- ================= 第一行：+  =  +  = ================= -->
    <!-- (25,25) + -->
    <line x1="10" y1="25" x2="40" y2="25"/>
    <line x1="25" y1="10" x2="25" y2="40"/>

    <!-- (75,25) / ：整体旋转 +45° 的 = -->
    <line x1="67.83" y1="10.95" x2="89.05" y2="32.17"/>
    <line x1="60.95" y1="17.83" x2="82.17" y2="39.05"/>

    <!-- (125,25) + -->
    <line x1="110" y1="25" x2="140" y2="25"/>
    <line x1="125" y1="10" x2="125" y2="40"/>

    <!-- (175,25) / ：整体旋转 +45° 的 = -->
    <line x1="167.83" y1="10.95" x2="189.05" y2="32.17"/>
    <line x1="160.95" y1="17.83" x2="182.17" y2="39.05"/>

    <!-- ================= 第二行：=  +  =  + ================= -->
    <!-- (25,75) \ ：整体旋转 -45° 的 = -->
    <line x1="10.95" y1="82.17" x2="32.17" y2="60.95"/>
    <line x1="17.83" y1="89.05" x2="39.05" y2="67.83"/>

    <!-- (75,75) + -->
    <line x1="60" y1="75" x2="90" y2="75"/>
    <line x1="75" y1="60" x2="75" y2="90"/>

    <!-- (125,75) \ ：整体旋转 -45° 的 = -->
    <line x1="110.95" y1="82.17" x2="132.17" y2="60.95"/>
    <line x1="117.83" y1="89.05" x2="139.05" y2="67.83"/>

    <!-- (175,75) + -->
    <line x1="160" y1="75" x2="190" y2="75"/>
    <line x1="175" y1="60" x2="175" y2="90"/>

    <!-- ================= 第三行：+  =  +  = ================= -->
    <!-- (25,125) + -->
    <line x1="10" y1="125" x2="40" y2="125"/>
    <line x1="25" y1="110" x2="25" y2="140"/>

    <!-- (75,125) / ：整体旋转 +45° 的 = -->
    <line x1="67.83" y1="110.95" x2="89.05" y2="132.17"/>
    <line x1="60.95" y1="117.83" x2="82.17" y2="139.05"/>

    <!-- (125,125) + -->
    <line x1="110" y1="125" x2="140" y2="125"/>
    <line x1="125" y1="110" x2="125" y2="140"/>

    <!-- (175,125) / ：整体旋转 +45° 的 = -->
    <line x1="167.83" y1="110.95" x2="189.05" y2="132.17"/>
    <line x1="160.95" y1="117.83" x2="182.17" y2="139.05"/>

    <!-- ================= 第四行：=  +  =  + ================= -->
    <!-- (25,175) \ ：整体旋转 -45° 的 = -->
    <line x1="10.95" y1="182.17" x2="32.17" y2="160.95"/>
    <line x1="17.83" y1="189.05" x2="39.05" y2="167.83"/>

    <!-- (75,175) + -->
    <line x1="60" y1="175" x2="90" y2="175"/>
    <line x1="75" y1="160" x2="75" y2="190"/>

    <!-- (125,175) \ ：整体旋转 -45° 的 = -->
    <line x1="110.95" y1="182.17" x2="132.17" y2="160.95"/>
    <line x1="117.83" y1="189.05" x2="139.05" y2="167.83"/>

    <!-- (175,175) + -->
    <line x1="160" y1="175" x2="190" y2="175"/>
    <line x1="175" y1="160" x2="175" y2="190"/>
  </g>
</svg>
