<svg xmlns="http://www.w3.org/2000/svg" width="16.88" height="16.88" viewBox="0 0 16.88 16.88">
  <!-- DZ/T 0179 表5 第四系成因花纹：冲积 al（最小可重复单元 16.88×16.88，累计 ×0.56 缩小版）
       底色透明（叠加于第四系年代色之上）；花纹色 C60 = R102 G255 B255（表5 冲积花纹色）；
       母元中心 (8.44, 8.44)：右上椭圆（长轴 45°，中心 +3.94,-3.94）、左下椭圆（长轴 135°，中心 -3.94,+3.94），
       rx=2.25、ry=1.12——两图形间距 11.2；列距 16.88、行距 16.88；线宽 0.83；
       瓦片四边均落在空隙，平铺时边界无裁切；
       2026-09-19 定稿几何 ×0.75 再 ×0.75 等比缩小（元素+间距+线宽同率，用户定） -->
  <g stroke="rgb(102,255,255)" stroke-width="0.83" fill="none">
    <!-- 右上椭圆：长轴 45° -->
    <ellipse cx="12.38" cy="4.5" rx="2.25" ry="1.12" transform="rotate(45 12.38 4.5)"/>
    <!-- 左下椭圆：长轴 135° -->
    <ellipse cx="4.5" cy="12.38" rx="2.25" ry="1.12" transform="rotate(135 4.5 12.38)"/>
  </g>
</svg>
