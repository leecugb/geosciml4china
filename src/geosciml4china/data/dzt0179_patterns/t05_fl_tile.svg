    <line x1="129.09" y1="129.09" x2="129.09" y2="140.62" />

    <!-- ================= 底部点组 ================= -->
    <line x1="2.53" y1="152.57" x2="2.53" y2="161.72" />
    <line x1="16.59" y1="152.57" x2="16.59" y2="161.72" />
