<svg xmlns="http://www.w3.org/2000/svg" width="139.5" height="161.72" viewBox="0 0 139.5 161.72">
  <!-- DZ/T 0179 表5 第四系成因花纹：沼积 fl（最小可重复单元 139.5×161.72，累计 ×0.14 缩小版）
       用一条线代表一个矩形块：每个条位一条竖线（线宽 2.81）；
       竖线间距 14.06（按序号重排：x = 2.53+14.06k，组构与线高不变）；跨缝间距 12.94；
       花纹色 C60 青 [102,255,255]；背景白色（叠加于第四系年代色使用时去除背景矩形即为透明底）；
       2026-09-19 定稿几何两轮 ×0.75 两轮 ×0.5（累计 ×0.14，元素+间距+线宽同率，用户定） -->

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- 竖线（标准配色 C60 青） -->
  <g stroke="rgb(102,255,255)" stroke-width="2.81" fill="none">

