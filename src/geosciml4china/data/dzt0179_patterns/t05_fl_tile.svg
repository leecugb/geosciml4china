    <line x1="72.84" y1="0" x2="72.84" y2="43.17" />
    <line x1="86.91" y1="16.45" x2="86.91" y2="51.33" />
    <line x1="100.97" y1="31.92" x2="100.97" y2="63.28" />
    <line x1="115.03" y1="43.59" x2="115.03" y2="70.31" />
    <line x1="129.09" y1="55.27" x2="129.09" y2="74.95" />

    <!-- ================= 中部波浪（k=7,8 缺） ================= -->
    <line x1="2.53" y1="111.52" x2="2.53" y2="140.62" />
