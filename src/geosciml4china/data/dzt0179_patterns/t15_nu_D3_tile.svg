<svg xmlns="http://www.w3.org/2000/svg" width="65" height="82" viewBox="0 0 65 82">
  <!-- νD3 辉长岩花纹：最小可重复单元 65×82（修正版，2026-09-18）
       修正：瓦片 x 原点取在无花纹空隙（相当于原网格 x=45 处），
       内容 = 2 个完整 X——A 行 (52.5,20.5)、B 行 (20,61.5)（B 相对 A 左移 32.5=50% 列距）；
       瓦片四边均落在空隙，平铺时边界无裁切，效果与原 650×410 网格一致 -->
  <rect width="65" height="82" fill="rgb(77,255,102)"/>
  <g stroke="white" stroke-width="3" fill="none">
    <!-- A 行完整 X，中心 (52.5, 20.5) -->
    <line x1="42.5" y1="5.5" x2="62.5" y2="35.5"/>
    <line x1="62.5" y1="5.5" x2="42.5" y2="35.5"/>
    <!-- B 行完整 X，中心 (20, 61.5)（错开 50% 列距） -->
    <line x1="10" y1="46.5" x2="30" y2="76.5"/>
    <line x1="30" y1="46.5" x2="10" y2="76.5"/>
  </g>
</svg>
