<svg xmlns="http://www.w3.org/2000/svg" width="50" height="64" viewBox="0 0 50 64">
  <!-- DZ/T 0179 表15 侵入岩填充花纹：δK2 晚白垩世闪长岩（最小可重复单元 50×64，加密版）
       底色 R51 G217 B255；花纹色白色；列距 50、行距 32（较 65×41 加密）；
       A 行 丄 中心 (37, 18)、B 行 丄 中心 (12, 50)（B 相对 A 左移 25 = 50% 列距）；
       母元 丄：横臂 dx=10（横:竖=2:1）、上竖臂 dy=10；瓦片四边均落在空隙，平铺时边界无裁切；
       2026-09-18 用户指定加密 -->
  <rect width="50" height="64" fill="rgb(51,217,255)"/>
  <g stroke="white" stroke-width="2" fill="none">
    <!-- A 行完整 丄，中心 (37, 18) -->
    <line x1="27" y1="18" x2="47" y2="18"/>
    <line x1="37" y1="8" x2="37" y2="18"/>
    <!-- B 行完整 丄，中心 (12, 50)，错开 50% 列距 -->
    <line x1="2" y1="50" x2="22" y2="50"/>
    <line x1="12" y1="40" x2="12" y2="50"/>
  </g>
</svg>
