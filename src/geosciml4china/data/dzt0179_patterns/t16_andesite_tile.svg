<svg xmlns="http://www.w3.org/2000/svg" width="65" height="82" viewBox="0 0 65 82">
  <!-- DZ/T 0179 表16 新生代以前火山岩花纹：安山岩（最小可重复单元 65×82）
       底色 R242 G179 B255（T2 统色，表16 示例 安山岩 T2s）；花纹色 K50 灰 R128 G128 B128（表16 规则）；
       参照 σS 橄榄岩模式：母元 倒V(^) 倒置为 V（宽角，dx=11、dy=10）；列距 65、行距 41；
       A 行 V 中心 (52.5, 20.5)、B 行 V 中心 (20, 61.5)（B 相对 A 左移 32.5 = 50% 列距）；
       瓦片四边均落在空隙，平铺时边界无裁切；2026-09-18 用户指定模式生成 -->
  <rect width="65" height="82" fill="rgb(242,179,255)"/>
  <g stroke="rgb(128,128,128)" stroke-width="2" fill="none">
    <!-- A 行完整 V，中心 (52.5, 20.5)：宽角人字朝下，dx=11、dy=10 -->
    <polyline points="41.5,10.5 52.5,30.5 63.5,10.5"/>
    <!-- B 行完整 V，中心 (20, 61.5)，错开 50% 列距 -->
    <polyline points="9,51.5 20,71.5 31,51.5"/>
  </g>
</svg>
