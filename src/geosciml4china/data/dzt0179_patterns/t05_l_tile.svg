<svg xmlns="http://www.w3.org/2000/svg" width="11.25" height="15.75" viewBox="0 0 11.25 15.75">
  <!-- DZ/T 0179 表5 第四系成因花纹：湖积 l（最小可重复单元 11.25×15.75，累计 ×0.56 缩小版）
       底色透明（叠加于第四系年代色之上）；花纹色 C60 = R102 G255 B255（表5 湖积花纹色）；
       仿照 δK2 闪长岩模式、基本元素为竖线；行距 = 线长 7.88、竖向间距为 0；
       竖直方向基本单元减半：每瓦片每列仅 1 段——奇数段 x=8.44（y 0–7.88）、偶数段 x=2.81（y 7.88–15.75），
       交错 5.63 = 50% 列距、连续性跨瓦片保持；列距 11.25；线宽 0.83；
       瓦片竖边落于空隙、线段端点恰接横边（竖列跨瓦片连续）；
       2026-09-19 定稿几何 ×0.75 再 ×0.75 等比缩小（元素+间距+线宽同率，用户定） -->
  <g stroke="rgb(102,255,255)" stroke-width="0.83" fill="none">
    <!-- 第1段 x=11.25，y 0–10.5 -->
    <line x1="8.44" y1="0" x2="8.44" y2="7.88"/>
    <!-- 第2段 x=3.75，y 10.5–21（与上段竖向相接） -->
    <line x1="2.81" y1="7.88" x2="2.81" y2="15.75"/>
  </g>
</svg>
