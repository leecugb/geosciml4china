<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- DZ/T 0179 表15 侵入岩填充花纹：ηγJ1 早侏罗世二长花岗岩（最小可重复单元 100×100）
       底色 R255 G51 B102；花纹白色；母元间距 50、棋盘交替，最小周期 2×2 母元格；
       内容 4 个完整母元——+ (25,25)、/ (75,25)（= 旋转 +45°）、\ (25,75)（= 旋转 -45°）、+ (75,75)；
       瓦片四边均落在空隙，平铺时边界无裁切；2026-09-18 提取（线位按用户给定） -->
  <rect width="100" height="100" fill="rgb(255,51,102)"/>
  <g stroke="white" stroke-width="2" fill="none">
    <!-- + ，中心 (25,25)：正交十字，臂长 15 -->
    <line x1="10" y1="25" x2="40" y2="25"/>
    <line x1="25" y1="10" x2="25" y2="40"/>
    <!-- / ，中心 (75,25)：双平行线 +45°（线长 30、间距 ~9.7） -->
    <line x1="67.83" y1="10.95" x2="89.05" y2="32.17"/>
    <line x1="60.95" y1="17.83" x2="82.17" y2="39.05"/>
    <!-- \ ，中心 (25,75)：双平行线 -45° -->
    <line x1="10.95" y1="82.17" x2="32.17" y2="60.95"/>
    <line x1="17.83" y1="89.05" x2="39.05" y2="67.83"/>
    <!-- + ，中心 (75,75) -->
    <line x1="60" y1="75" x2="90" y2="75"/>
    <line x1="75" y1="60" x2="75" y2="90"/>
  </g>
</svg>
