<svg xmlns="http://www.w3.org/2000/svg" width="11.82" height="15.75" viewBox="0 0 11.82 15.75">
  <!-- DZ/T 0179 表5 第四系成因花纹：风积 eol（最小可重复单元 11.82×15.75，累计 ×0.39 缩小版）
       底色透明（叠加于第四系年代色之上）；花纹色 M25 Y36 K15 = R217 G163 B139（表5 风积花纹色）；
       参照 δK2 闪长岩模式：元素为圆点（r=1.18 实心）；
       列距 11.82、行距 7.88；A 行圆点中心 (8.67, 3.93)、B 行圆点中心 (2.76, 11.82)（B 相对 A 左移 5.91 = 50% 列距）；
       瓦片四边均落在空隙，平铺时边界无裁切；2026-09-19 定稿几何两轮 ×0.75 再 ×0.7（累计 ×0.39，元素+间距同率，用户定） -->
  <g fill="rgb(217,163,139)" stroke="none">
    <!-- A 行圆点，中心 (22, 10) -->
    <circle cx="8.67" cy="3.93" r="1.18"/>
    <!-- B 行圆点，中心 (7, 30)，错开 50% 列距 -->
    <circle cx="2.76" cy="11.82" r="1.18"/>
  </g>
</svg>
