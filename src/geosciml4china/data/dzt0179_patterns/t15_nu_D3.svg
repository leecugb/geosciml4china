<svg xmlns="http://www.w3.org/2000/svg" width="150" height="100" viewBox="0 0 150 100">
  <!-- DZ/T 0179 表15 侵入岩填充花纹：νD3 晚泥盆世辉长岩（修改版）
       底色 R77 G255 B102；花纹白色；2026-09-18 用户给定人工转录版 -->
  <rect width="150" height="100" fill="rgb(77,255,102)"/>

  <g stroke="white" stroke-width="1.5" fill="none">
    <!-- ================= 第一行：3个X，中心 y=20 ================= -->
    <line x1="19" y1="9.61" x2="31" y2="30.39"/>
    <line x1="31" y1="9.61" x2="19" y2="30.39"/>

    <line x1="69" y1="9.61" x2="81" y2="30.39"/>
    <line x1="81" y1="9.61" x2="69" y2="30.39"/>

    <line x1="119" y1="9.61" x2="131" y2="30.39"/>
    <line x1="131" y1="9.61" x2="119" y2="30.39"/>

    <!-- ================= 第二行：左端< + 2个完整X + 右端>，中心 y=50 ================= -->
    <!-- 左端半个X：中心 x=6，只画左半部分 -->
    <line x1="6" y1="39.61" x2="0" y2="50"/>
    <line x1="0" y1="50" x2="6" y2="60.39"/>

    <!-- 完整 X4 (50,50) -->
    <line x1="44" y1="39.61" x2="56" y2="60.39"/>
    <line x1="56" y1="39.61" x2="44" y2="60.39"/>

    <!-- 完整 X5 (100,50) -->
    <line x1="94" y1="39.61" x2="106" y2="60.39"/>
    <line x1="106" y1="39.61" x2="94" y2="60.39"/>

    <!-- 右端半个X：中心 x=144，只画右半部分 -->
    <line x1="144" y1="39.61" x2="150" y2="50"/>
    <line x1="150" y1="50" x2="144" y2="60.39"/>

    <!-- ================= 第三行：3个X，中心 y=80 ================= -->
    <line x1="19" y1="69.61" x2="31" y2="90.39"/>
    <line x1="31" y1="69.61" x2="19" y2="90.39"/>

    <line x1="69" y1="69.61" x2="81" y2="90.39"/>
    <line x1="81" y1="69.61" x2="69" y2="90.39"/>

    <line x1="119" y1="69.61" x2="131" y2="90.39"/>
    <line x1="131" y1="69.61" x2="119" y2="90.39"/>
  </g>
</svg>
