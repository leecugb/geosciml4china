name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (package + deps; mapgis2shp from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Smoke (import / package data / registry / config contract)
        shell: bash
        run: |
          if ! pytest tests/ -q > smoke.log 2>&1; then \
            tail -40 smoke.log; \
            body=$(tail -60 smoke.log | python -c "import sys,json; print(json.dumps(sys.stdin.read()))"); \
            curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
              -d "{\"title\":\"ci smoke failure (${{ matrix.os }}, py${{ matrix.python }})\",\"body\":$body,\"labels\":[\"ci\"]}"; \
            exit 1; \
          fi
          tail -5 smoke.log
