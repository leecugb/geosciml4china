name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (package + deps; mapgis2shp from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Smoke (import / package data / registry / config contract)
        shell: bash
        run: |
          pytest tests/ -q > smoke.log 2>&1 || { \
            tail -50 smoke.log | sed 's/^/::error file=smoke.log::/' | head -50 || true; \
            tail -40 smoke.log; \
            exit 1; }
          tail -5 smoke.log
