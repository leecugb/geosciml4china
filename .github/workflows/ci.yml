name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (package + deps; mapgis2shp from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Smoke (import / package data / registry / config contract)
        run: pytest tests/ -q
