name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (package + deps; mapgis2shp from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Smoke (import / package data / registry / config contract)
        shell: bash
        run: |
          if ! pytest tests/ -q > smoke.log 2>&1; then \
            mkdir -p ci_reports; \
            cp smoke.log "ci_reports/smoke_${{ matrix.os }}_py${{ matrix.python }}.log"; \
            git config user.email "ci@example.com"; \
            git config user.name "ci-bot"; \
            git add ci_reports/ && \
            git commit -m "ci: capture smoke failure log (${{ matrix.os }}, py${{ matrix.python }}) [skip ci]" && \
            git push origin HEAD:main || true; \
            tail -40 smoke.log; \
            exit 1; \
          fi
          tail -5 smoke.log
